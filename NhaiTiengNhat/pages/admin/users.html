<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý người dùng | Nihongo Learning</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <script src="../../js/auth.js" defer></script>
    <script src="../../js/admin.js" defer></script>
  </head>
  <body
    data-require-login="true"
    data-require-admin="true"
    data-login-href="../auth/login.html"
    data-dashboard-href="../dashboard.html"
    data-admin-dashboard-href="index.html"
    data-page="users"
  >
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark" aria-hidden="true">あ</span>
          <span>NhaiTiengNhat</span>
        </div>

        <nav class="admin-nav" aria-label="Điều hướng quản trị">
          <a href="index.html">Tổng quan</a>
          <a href="../lessons/index.html">Bài học</a>
          <a href="../kanji/index.html?admin=1">Học liệu</a>
          <a href="feedback.html">Nhận xét</a>
          <a href="users.html" aria-current="page">Người dùng</a>
          <a href="progress.html">Tiến độ</a>
          <a href="reports.html">Báo cáo</a>
          <a href="settings.html">Cài đặt</a>
        </nav>

        <div class="admin-user-card">
          <p class="section-kicker">Đăng nhập</p>
          <strong data-admin-user-name>Quản trị viên</strong>
          <a href="../auth/profile.html">Hồ sơ cá nhân</a>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div>
            <p class="section-kicker">QUẢN LÝ</p>
            <h1>Người dùng</h1>
          </div>
          <a class="button button-primary" href="index.html">Quay lại tổng quan</a>
        </header>

        <section class="admin-panel">
          <div class="admin-toolbar">
            <div class="panel-heading" style="margin-bottom: 0;">
              <h2>Danh sách tài khoản</h2>
            </div>
            <input
              id="admin-user-search"
              class="admin-search"
              type="search"
              aria-label="Tìm kiếm người dùng"
              placeholder="Tìm tên, username hoặc email"
            />
          </div>

          <div class="table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Họ tên</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Ngày tạo</th>
                  <th>Trạng thái tài khoản</th>
                </tr>
              </thead>
              <tbody id="admin-users-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
